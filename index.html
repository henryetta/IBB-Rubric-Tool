<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-BB Barrier Rubric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ibb_shared.js"></script>
<style>
  :root{
    --bg:#EEF1F5; --panel:#FFFFFF; --ink:#1B2432; --ink-soft:#5B6472;
    --line:#DDE2E9; --accent:#3B5BA5; --accent-ink:#FFFFFF; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; min-height:100vh; display:flex; justify-content:center; padding:32px 16px;}
  .app{width:100%; max-width:720px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; font-weight:600;}
  h1{font-size:22px; margin:0 0 4px; font-weight:700; letter-spacing:-.01em;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0 0 24px; line-height:1.5;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:0 1px 2px rgba(20,30,50,0.04);}
  label{display:block; font-size:13px; font-weight:600; margin:0 0 6px; color:var(--ink);}
  .hint{font-size:12px; color:var(--ink-soft); margin:-2px 0 8px;}
  input[type=text]{width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-family:'IBM Plex Sans',sans-serif; font-size:14px; color:var(--ink); background:#FBFCFD;}
  input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field{margin-bottom:18px;}
  button{font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14px; border:none; border-radius:9px; padding:12px 20px; cursor:pointer;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .row{display:flex; gap:12px; margin-top:22px;}
  .row.end{justify-content:flex-end;}
  .refbox{background:#F3F6FB; border:1px solid #DCE4F0; border-radius:11px; padding:16px 18px; margin-bottom:22px;}
  .refbox .k{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:600;}
  .refbox p{margin:4px 0 0; font-size:14px; line-height:1.5; color:var(--ink);}
  .refbox p + p{margin-top:8px;}
  .progress-track{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--accent); transition:width .25s ease;}
  .progress-label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin:-16px 0 18px; text-align:right;}
  .item-text{font-size:19px; line-height:1.45; font-weight:500; margin:0 0 26px; color:var(--ink);}
  .scale{display:flex; gap:8px;}
  .scale button{flex:1; padding:16px 4px; background:#FBFCFD; border:1.5px solid var(--line); border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .scale button .num{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; color:var(--ink);}
  .scale button .lbl{font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.2;}
  .scale button.selected{background:var(--accent); border-color:var(--accent);}
  .scale button.selected .num, .scale button.selected .lbl{color:#fff;}
  .consent-text{font-size:14px; line-height:1.65; color:var(--ink);}
  .consent-text p{margin:0 0 12px;}
  .check-row{display:flex; align-items:flex-start; gap:10px; margin-top:18px; padding:14px; background:#F8F9FB; border-radius:10px;}
  .check-row input{margin-top:2px;}
  .check-row label{font-weight:500; font-size:13px; margin:0; color:var(--ink);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
let state = { screen:'noLink', domain:null, meta:null, order:[], idx:0, responses:{}, prolificId:'', surveyStartedAt:null };

function render(){
  const app = document.getElementById('app');

  if(state.screen === 'noLink'){
    app.innerHTML = `
      <div class="eyebrow">I-BB Barrier Rubric</div>
      <h1>No study link provided</h1>
      <div class="panel"><p style="font-size:14px; line-height:1.6;">This page needs a specific link to work. If you were sent here to complete a survey, please use the exact link you were given rather than this page directly.</p></div>
    `;
    return;
  }

  if(state.screen === 'loadError'){
    app.innerHTML = `
      <div class="eyebrow">I-BB Barrier Rubric</div>
      <h1>Connection problem</h1>
      <div class="panel"><p style="font-size:14px; line-height:1.6;">Couldn't load this study. Please try the link again, or contact the researcher who sent it to you.</p></div>
    `;
    return;
  }

  if(state.screen === 'consent'){
    app.innerHTML = `
      <div class="eyebrow">${escapeHtml(state.domain)}</div>
      <h1>Before you begin</h1>
      <div class="panel">
        <div class="consent-text">
          <p>This questionnaire asks you to rate a series of statements about a specific everyday behaviour. It takes about 2–3 minutes. Your responses are used for academic research and are recorded under your Prolific ID for payment purposes only.</p>
          <p>There are no right or wrong answers — please answer according to your own honest experience. You may stop at any time without penalty; simply close this window.</p>
          <p>By continuing, you confirm that you are 18 years of age or older and consent to take part in this study.</p>
        </div>
        <div class="field" style="margin-top:20px;">
          <label for="prolificId">Prolific ID</label>
          <div class="hint">Required to access this survey and to match your response for payment.</div>
          <input type="text" id="prolificId" placeholder="Enter your Prolific ID" autocomplete="off">
        </div>
        <div class="check-row">
          <input type="checkbox" id="agreeBox">
          <label for="agreeBox">I have read the above and agree to participate.</label>
        </div>
        <div class="row end">
          <button class="btn-primary" id="beginBtn" disabled>Begin questionnaire</button>
        </div>
      </div>
    `;
    const pidEl = document.getElementById('prolificId');
    const agreeEl = document.getElementById('agreeBox');
    const checkReady = () => { document.getElementById('beginBtn').disabled = !(pidEl.value.trim() && agreeEl.checked); };
    pidEl.oninput = checkReady;
    agreeEl.onchange = checkReady;
    document.getElementById('beginBtn').onclick = () => {
      state.prolificId = pidEl.value.trim();
      state.order = shuffle(ITEMS.concat(ATTENTION_ITEMS));
      state.idx = 0;
      state.responses = {};
      state.surveyStartedAt = Date.now();
      state.screen = 'survey';
      render();
    };
    return;
  }

  if(state.screen === 'survey'){
    const item = state.order[state.idx];
    const pct = Math.round((state.idx/state.order.length)*100);
    app.innerHTML = `
      <div class="eyebrow">${escapeHtml(state.domain)}</div>
      <h1>Rate each statement</h1>
      <p class="sub">Answer according to your own experience. There are no right or wrong answers.</p>
      <div class="refbox">
        <div class="k">Scenario</div><p>${escapeHtml(state.meta.scenario)}</p>
        <div class="k" style="margin-top:10px;">This behaviour refers to</div><p>${escapeHtml(state.meta.behaviour)}</p>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${state.idx+1} of ${state.order.length}</div>
      <div class="panel">
        <p class="item-text">${escapeHtml(item.text)}</p>
        <div class="scale">
          ${SCALE.map(s => `<button data-v="${s.v}" class="${state.responses[item.code]===s.v?'selected':''}"><span class="num">${s.v}</span><span class="lbl">${s.l.replace('\n','<br>')}</span></button>`).join('')}
        </div>
        <div class="row end">
          <button class="btn-primary" id="nextBtn" ${state.responses[item.code]?'':'disabled'}>${state.idx===state.order.length-1?'Finish':'Next'}</button>
        </div>
      </div>
    `;
    app.querySelectorAll('.scale button').forEach(btn=>{
      btn.onclick = () => { state.responses[item.code] = parseInt(btn.dataset.v); render(); };
    });
    document.getElementById('nextBtn').onclick = async () => {
      if(!state.responses[item.code]) return;
      if(state.idx < state.order.length-1){ state.idx++; render(); return; }
      const profile = computeProfile(state.responses);
      const attention = computeAttention(state.responses);
      const durationSeconds = Math.round((Date.now() - state.surveyStartedAt)/1000);
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = true; nextBtn.textContent = 'Saving...';
      try{
        await saveRespondentRemote(state.domain, state.prolificId, profile, attention, durationSeconds, state.surveyStartedAt);
        state.screen = 'done';
        render();
      }catch(e){
        alert('Could not save your response, please try again: ' + (e.message || 'unknown error'));
        nextBtn.disabled = false; nextBtn.textContent = 'Finish';
      }
    };
    return;
  }

  if(state.screen === 'done'){
    app.innerHTML = `
      <div class="eyebrow">${escapeHtml(state.domain)}</div>
      <h1>Thank you</h1>
      <div class="panel"><p style="font-size:15px; line-height:1.6;">Your responses have been recorded. You may now close this window.</p></div>
    `;
    return;
  }
}

async function boot(){
  const params = new URLSearchParams(window.location.search);
  const domainParam = params.get('domain');
  if(!domainParam){ state.screen = 'noLink'; render(); return; }
  try{
    const domains = await fetchDomainMeta();
    if(!domains[domainParam]){ state.screen = 'noLink'; render(); return; }
    state.domain = domainParam;
    state.meta = domains[domainParam];
    state.screen = 'consent';
  }catch(e){
    state.screen = 'loadError';
  }
  render();
}
boot();
</script>
</body>
</html>
